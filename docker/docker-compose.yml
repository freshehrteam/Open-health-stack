# ============================================================================
# freshehr-open-health-stack — Layer 1: local docker-compose
# ----------------------------------------------------------------------------
# The whole stack, self-contained: hapi (+openFHIR interceptor), ehrbase, the
# openFHIR engine, hades (FHIR terminology server), keycloak (OIDC IdP),
# oauth2-proxy (edge token validator), ONE shared Postgres (a database each
# for ehrbase/hapi/openfhir/keycloak), and nginx — 8 services.
#
# Everything runs in-cluster — there is no hosted-sandbox mode. The openFHIR engine
# therefore REQUIRES the vendor license at openfhir/license/openfhir-license.json
# (gitignored); request one at https://open-fhir.com#access.
#
# Auth (mirrors the k8s ingress split):
#   /fhir         edge-validated by nginx auth_request -> oauth2-proxy
#   /ehrbase      EHRbase validates natively (SECURITY_AUTHTYPE=OAUTH)
#   /openfhir     engine validates natively (openfhir.protected, per-API scopes)
#   /terminology  edge-validated by nginx auth_request -> oauth2-proxy
#   /auth         Keycloak itself, public (token/discovery endpoints)
# Get a Bearer token with `make token` (client_credentials, api-client).
#
# Usage:
#   cp ../.env.example .env          # fill creds
#   docker compose build hapi hades  # the two locally-built custom images
#   docker compose up -d             # all 8 services
#   make template                    # once per fresh CDR: upload the EPS OPT to EHRbase
#   make bootstrap                   # once per fresh CDR: load openFHIR mappings +
#                                    # ConceptMaps under tenant `freshehr` (the engine's
#                                    # startup bootstrap is tenant-invisible when protected)
#
# ⚠️ Upgrading an existing install to the keycloak-enabled stack needs ONE
# volume wipe (`docker compose down -v`): postgres init scripts (which now also
# create the keycloak DB) only run on first boot. Re-run `make template` and
# `make bootstrap` after.
# ============================================================================

services:
  # ── HAPI FHIR + openFHIR interceptor (FHIR facade) ────────────────────────
  hapi:
    build:
      context: ./hapi
    image: ${HAPI_IMAGE:-ghcr.io/freshehrteam/hapi-openfhir:latest}
    container_name: freshehr-hapi
    # No host port here: the direct-port dev bypass (8080:8080) lives in
    # docker-compose.override.yml. Authenticated access goes via nginx /fhir.
    volumes:
      - ./hapi/application.yml:/app/config/application.yml:ro
      - ./hapi/cdrs.yml:/etc/cdrs.yml:ro
    environment:
      HAPI_FHIR_IPS_ENABLED: ${HAPI_FHIR_IPS_ENABLED:-true}
      HAPI_DB_USER: ${HAPI_DB_USER:-hapi}
      HAPI_DB_PASS: ${HAPI_DB_PASS:-hapi}
      # The in-cluster openFHIR engine. The engine is a protected resource
      # server (openfhir.protected=true), so application.yml carries a full
      # openfhir.oauth2 block (hapi-svc client_credentials) — the interceptor's
      # all-or-none rule means the three props are always set together.
      OPENFHIR_BASE_URL: ${OPENFHIR_BASE_URL:-http://openfhir:8080}
      KC_HAPI_SVC_SECRET: ${KC_HAPI_SVC_SECRET:-dev-hapi-svc-secret}
    depends_on:
      postgres:
        condition: service_healthy
      openfhir:
        condition: service_healthy
    # No container healthcheck: the hapiproject/hapi image is distroless — no shell,
    # no curl, no wget — so any in-container probe is a dead end (the previous
    # CMD-SHELL/curl check could never run and pinned the container to `unhealthy`
    # while it was serving traffic normally). HAPI's readiness is verified from the
    # host instead: `make smoke`, or GET /actuator/health (Spring Boot actuator,
    # returns 200) / /fhir/metadata.
    networks:
      - health-stack

  # ── EHRbase (openEHR CDR) ─────────────────────────────────────────────────
  ehrbase:
    # Pinned, not :latest — matches the Helm chart (values.yaml ehrbase.image.tag);
    # the MANAGEMENT_* env below is version-coupled to this tag.
    image: ehrbase/ehrbase:2.36.0
    container_name: freshehr-ehrbase
    # Direct host port (8082:8080) lives in docker-compose.override.yml.
    environment:
      # Native OAuth2 resource server (vendor-supported): EHRbase validates
      # Bearer tokens itself, so /ehrbase deliberately has NO nginx auth_request
      # (mirrors the k8s /ehrbase Ingress). Roles come from realm_access.roles.
      SECURITY_AUTHTYPE: ${EHRBASE_SECURITY_AUTHTYPE:-OAUTH}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUERURI: ${OIDC_ISSUER_URI:-http://keycloak:8080/auth/realms/freshehr}
      # Explicit defaults, stated for greppability: non-admin endpoints need
      # USER, /rest/admin/** needs ADMIN.
      SECURITY_OAUTH2USERROLE: USER
      SECURITY_OAUTH2ADMINROLE: ADMIN
      # In OAUTH mode /rest/status is no longer public, so the healthcheck moves
      # to the Spring management health endpoint — these two make it public.
      # ⚠ VERSION-COUPLED to the pinned image above (must match the chart's
      # ehrbase env): EHRbase ≥2.35 sets management.endpoint.health.ACCESS in
      # its bundled config (override the same property), while ≤2.28 sets
      # health.ENABLED — and Spring treats the enabled+access PAIR as mutually
      # exclusive, so using the wrong one for the image generation crashes
      # EHRbase at startup. If you change the image tag, check which property
      # that version's bundled application.yml uses. WEB_ACCESS is an
      # EHRbase-custom enum (ADMIN_ONLY|PRIVATE|PUBLIC).
      MANAGEMENT_ENDPOINT_HEALTH_ACCESS: READ_ONLY
      MANAGEMENT_ENDPOINTS_WEB_ACCESS: PUBLIC
      DB_URL: jdbc:postgresql://postgres:5432/ehrbase
      DB_USER: ${EHRBASE_DB_USER:-ehrbase_restricted}
      DB_PASS: ${EHRBASE_DB_PASS:-ehrbase_restricted}
      DB_USER_ADMIN: ${EHRBASE_DB_USER_ADMIN:-ehrbase}
      DB_PASS_ADMIN: ${EHRBASE_DB_PASS_ADMIN:-ehrbase}
      SERVER_NODENAME: ${EHRBASE_SERVER_NODENAME:-local.ehrbase.org}
      SPRING_PROFILES_ACTIVE: local
    depends_on:
      postgres:
        condition: service_healthy
      # Spring fetches the issuer's OIDC metadata at startup; without a live
      # Keycloak, EHRbase exits immediately.
      keycloak:
        condition: service_healthy
    healthcheck:
      # The ehrbase image ships BusyBox wget only (no curl). /ehrbase/rest/status
      # requires a Bearer token in OAUTH mode, so probe the unauthenticated
      # management health endpoint instead (made public via MANAGEMENT_* above).
      # A successful fetch proves EHRbase + its DB are up.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/ehrbase/management/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    networks:
      - health-stack

  # ── Keycloak (OIDC identity provider) ─────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    container_name: freshehr-keycloak
    command: ["start-dev", "--import-realm"]
    ports:
      # Host callers fetch tokens at http://localhost:8081/auth/... — Keycloak
      # answers under any Host header, but the token's `iss` is always the
      # canonical KC_HOSTNAME below. Kept in the BASE compose file (not the
      # override): the token endpoint is part of the stack's contract.
      - "8081:8080"
    environment:
      # KC 26 names (KEYCLOAK_ADMIN/_PASSWORD are the pre-26 spelling).
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASS:-keycloak}
      # Single canonical issuer strategy: serve under /auth and pin the issuer
      # to the in-network URL. Backchannel-dynamic stays off — enabling it makes
      # `iss` request-dependent and breaks EHRbase/oauth2-proxy validation.
      # Trade-off: browser SSO redirect flows from the host don't work locally
      # (phase 1 is Bearer-API-only); the admin console stays usable via
      # KC_HOSTNAME_ADMIN.
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: http://keycloak:8080/auth
      KC_HOSTNAME_ADMIN: http://localhost:8081/auth
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
    volumes:
      # Realm `freshehr` (roles, clients, fixed dev secrets) auto-imported on
      # first boot. Fixed secrets are deliberate: env substitution inside realm
      # imports is not dependable; mirrors .env.example.
      #
      # Realm-JSON constraints learned the hard way:
      # - Defining a top-level `clientScopes` array REPLACES the realm's entire
      #   scope set: the built-ins (roles, profile, email, web-origins, acr,
      #   basic) are never created, so realm_access.roles vanishes from every
      #   token no matter how clients attach scopes. Hence: the openFHIR scopes
      #   attach as optionalClientScopes (same-file scopes DO attach) and are
      #   requested explicitly via scope= (make token / openfhir.oauth2.scope),
      #   while realm_access.roles + the oauth2-proxy audience are restored via
      #   per-client protocol mappers (realm-roles / oauth2-proxy-audience).
      #   The `email`/`profile` built-ins are recreated too: oauth2-proxy's
      #   BROWSER flow requests scope=openid email profile, and Keycloak
      #   rejects the whole auth request (invalid_scope) if they don't exist.
      # - Same-file clients do NOT receive defaultDefaultClientScopes at import
      #   either — that list only applies to clients created AFTER import. The
      #   realm therefore defines a minimal `roles` scope and lists it there so
      #   companion apps that self-register clients via the admin API (e.g.
      #   nictiz-ui's `npm run register`) still get realm_access.roles; the
      #   stack's own imported clients rely on their per-client mappers.
      # - Client `description` fields cap at 255 chars (DB column); longer
      #   values abort the whole import with "value too long".
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The keycloak image has no curl/wget — talk HTTP over bash's /dev/tcp to
      # the management port (9000, path /auth/... via KC_HTTP_MANAGEMENT_RELATIVE_PATH).
      test:
        - CMD
        - /bin/bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          echo -e 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - health-stack

  # ── oauth2-proxy (edge Bearer-token validator for nginx auth_request) ─────
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    container_name: freshehr-oauth2-proxy
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OIDC_ISSUER_URI:-http://keycloak:8080/auth/realms/freshehr}
      OAUTH2_PROXY_CLIENT_ID: oauth2-proxy
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:-dev-oauth2-proxy-secret}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:-0123456789abcdef0123456789abcdef}
      OAUTH2_PROXY_REDIRECT_URL: https://localhost/oauth2/callback
      # Pure Bearer validation for nginx auth_request — no session/cookie flow.
      OAUTH2_PROXY_SKIP_JWT_BEARER_TOKENS: "true"
      # Service-account tokens carry no email claim; identify by `sub` and
      # accept any domain. Insecure-unverified is fine: the JWT signature +
      # issuer + audience checks are what gate access here.
      OAUTH2_PROXY_OIDC_EMAIL_CLAIM: sub
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL: "true"
      # auth_request-only deployment: no real upstream behind the proxy.
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      # Fallback if the oauth2-proxy-audience mapper ever misbehaves, uncomment:
      # OAUTH2_PROXY_OIDC_EXTRA_AUDIENCES: account
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - health-stack

  # ── Shared Postgres (databases: ehrbase · hapi · openfhir) ────────────────
  postgres:
    image: ehrbase/ehrbase-v2-postgres:16.2
    container_name: freshehr-postgres
    ports:
      - "5439:5432"
    environment:
      POSTGRES_USER: ${EHRBASE_PG_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${EHRBASE_PG_SUPERPASSWORD:-postgres}
      EHRBASE_USER: ${EHRBASE_DB_USER:-ehrbase_restricted}
      EHRBASE_PASSWORD: ${EHRBASE_DB_PASS:-ehrbase_restricted}
      EHRBASE_USER_ADMIN: ${EHRBASE_DB_USER_ADMIN:-ehrbase}
      EHRBASE_PASSWORD_ADMIN: ${EHRBASE_DB_PASS_ADMIN:-ehrbase}
    volumes:
      # 02- prefix ⇒ runs after the image's own ehrbase schema bootstrap.
      - ./ehrbase/init-db.sql:/docker-entrypoint-initdb.d/02-tenants.sql:ro
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` alone is a FALSE POSITIVE on first boot: it reports ready
      # while /docker-entrypoint-initdb.d/*.sql are still running against the
      # temporary local-only server, which then restarts. Dependents that start in
      # that window die with "The connection attempt failed". Probing for the last
      # database our init script creates proves the bootstrap actually finished.
      test: ["CMD-SHELL", "psql -U $${POSTGRES_USER} -lqt | cut -d'|' -f1 | grep -qw keycloak"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - health-stack

  # ── openFHIR engine (FHIR ⇄ openEHR mapping) ──────────────────────────────
  openfhir:
    # openfhir-enterprise, NOT openfhir: the Postgres repository implementation
    # (openfhir.db.type=postgres) ships only in the enterprise engine. The community
    # openfhir image is Mongo-only, so it fails with "No qualifying bean of type
    # FhirConnectModelRepository" under a postgres config.
    # Pinned (matches the Helm chart openfhir.image.tag); OPENFHIR_IMAGE still
    # overrides for local engine builds.
    image: ${OPENFHIR_IMAGE:-openfhir/openfhir-enterprise:3.0.2}
    container_name: freshehr-openfhir
    # Direct host port (8083:8080) lives in docker-compose.override.yml.
    environment:
      # The engine reads Spring's standard datasource keys; application.yaml
      # interpolates OPENFHIR_DB_USER/PASS into spring.datasource.*.
      OPENFHIR_DB_USER: ${OPENFHIR_DB_USER:-openfhir}
      OPENFHIR_DB_PASS: ${OPENFHIR_DB_PASS:-openfhir}
      # Load the mounted config EXPLICITLY. Spring Boot only auto-detects
      # ./application.yaml relative to WorkingDir, and the Docker Hub image sets
      # no WORKDIR (so WorkingDir=/, with the jar at /app.jar), while locally
      # built tags use WORKDIR /app. Under the Hub image the file mounted at
      # /app/application.yaml is therefore silently ignored and the engine falls
      # back to its Mongo defaults. The symptom is NOT a config error but a bean
      # error at startup: "No qualifying bean of type ... OptRepository"
      # (openfhir.db.type never reaches @ConditionalOnProperty). Setting the
      # location explicitly works under either image.
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/application.yaml
    volumes:
      # MUST be /app/application.yaml — WorkingDir=/app, so Spring Boot reads
      # ./application.yaml from there. Mounting at / is silently ignored.
      - ./openfhir/application.yaml:/app/application.yaml:ro
      - ./openfhir/bootstrap:/app/bootstrap:ro
      # License is vendor-provided + gitignored; required for the local engine.
      - ./openfhir/license/openfhir-license.json:/app/openfhir-license.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # BusyBox wget, not curl: the enterprise image ships no curl, so the previous
      # `curl -fsS` probe exited 127 and pinned the container to `unhealthy` while
      # /health was serving 200 — which in turn blocked hapi/nginx via depends_on.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    networks:
      - health-stack

  # ── hades (FHIR terminology server: SNOMED CT / LOINC / FHIR packages) ────
  hades:
    build:
      context: ./hades
    image: ${HADES_IMAGE:-ghcr.io/freshehrteam/hades:0.4.2}
    container_name: freshehr-hades
    # No Postgres wiring on purpose: hades keeps its terminology in local *.db
    # files on the volume below (upstream hermes storage), not a SQL database.
    # Direct host port (8084:8080) lives in docker-compose.override.yml.
    environment:
      JAVA_OPTS: ${HADES_JAVA_OPTS:--Xmx1g}
    volumes:
      - hades-data:/data          # named volume: entrypoint WRITES here
    healthcheck:
      # /fhir/metadata = CapabilityStatement; hades has no dedicated health
      # endpoint. curl is installed by our Dockerfile (temurin ships none).
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/fhir/metadata >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s          # first boot downloads + indexes FHIR packages
    networks:
      - health-stack

  # ── nginx reverse proxy + TLS ─────────────────────────────────────────────
  nginx:
    image: nginx:1.31-alpine
    container_name: freshehr-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - hapi
      - ehrbase
      - openfhir
      - hades
      - keycloak
      - oauth2-proxy
    healthcheck:
      # Use 127.0.0.1 (not "localhost", which may resolve to ::1 first) so the
      # check hits the IPv4 :443 listener nginx binds.
      test: ["CMD-SHELL", "curl -fsSk https://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - health-stack

volumes:
  db-data:
  hades-data:

networks:
  health-stack:
    driver: bridge
