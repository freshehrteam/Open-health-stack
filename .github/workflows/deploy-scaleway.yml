# Auto-deploy to the Scaleway cluster (a development environment) on push to
# main, or on demand against any other branch.
#
# This runs a real `terraform apply` — not a standalone `helm upgrade`. Every
# credential the health-stack chart needs (DB passwords, Keycloak/OAuth2
# secrets) is generated by terraform/envs/scaleway's random_password resources
# and injected via helm_release.health_stack's set_sensitive
# (terraform/modules/k8s-apps/main.tf). A separate CI path that ran helm
# directly would either have to duplicate those secrets into GitHub (a second
# source of truth that can drift) or risk wiping them, since
# values-scaleway.yaml deliberately blanks the Keycloak ones and sets
# secrets.create=false for a bare manual install. Terraform apply sidesteps
# all of that by being the only thing that ever touches this release.
#
# PRECONDITION: the cluster + CCM/CSI must already exist (phases 1 and 2 of
# envs/scaleway/README.md's three-phase apply, run by hand) — this workflow
# only ever runs a plain `terraform apply` (phase 3 defaults), it does not
# pass install_apps=false or install_cloud_integration=false.
#
# NETWORK NOTE: the k3s API (port 6443) needs to be reachable from wherever
# this workflow runs. GitHub-hosted runners have no fixed IP, which is why
# terraform/modules/scaleway-cluster's security group now has a separate
# k3s_api_cidrs input (default 0.0.0.0/0, safe since 6443 requires a valid
# client cert) instead of reusing admin_ssh_cidrs — don't lock k3s_api_cidrs
# down to a specific IP unless this workflow also moves to a self-hosted
# runner with that same fixed IP.
#
# ── ONE-TIME SETUP ───────────────────────────────────────────────────────────
# Repository secrets (Settings → Secrets and variables → Actions → Secrets):
#   SCW_ACCESS_KEY, SCW_SECRET_KEY, SCW_PROJECT_ID — same values as your local
#     terraform.tfvars. Used both for the S3-compatible state backend
#     (AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY) and as TF_VAR_scw_* for the
#     Scaleway provider itself.
#   SCALEWAY_KUBECONFIG — contents of the kubeconfig your local `terraform
#     apply` already fetched (terraform/envs/scaleway/kubeconfig by default).
#     The kubeconfig-fetch provisioner only re-runs if the control-plane is
#     recreated (its trigger is the control-plane's id) — on a routine apply
#     the k8s/helm providers need the file already present, which an ephemeral
#     CI runner doesn't have unless it's seeded here.
#   SCALEWAY_SSH_PUBLIC_KEY — contents of your ssh_public_key_path file (not
#     secret data, but `file(pathexpand(var.ssh_public_key_path))` still needs
#     an actual file on disk to read at plan time, even though this key isn't
#     changing).
# Repository variables (Settings → Secrets and variables → Actions → Variables):
#   TF_DOMAIN, TF_LETSENCRYPT_EMAIL — same values as your local terraform.tfvars.
name: deploy-scaleway

on:
  push:
    branches: [main]
    paths:
      - "terraform/envs/scaleway/**"
      - "terraform/modules/**"
      - "charts/health-stack/**"
      - ".github/workflows/deploy-scaleway.yml"
  workflow_dispatch: {} # run against any branch: gh workflow run deploy-scaleway.yml --ref <branch>

env:
  TF_DIR: terraform/envs/scaleway

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: scaleway
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Seed kubeconfig + SSH public key (see header comment)
        working-directory: ${{ env.TF_DIR }}
        run: |
          umask 077
          printf '%s' "${{ secrets.SCALEWAY_KUBECONFIG }}" > ./kubeconfig
          printf '%s' "${{ secrets.SCALEWAY_SSH_PUBLIC_KEY }}" > "$RUNNER_TEMP/scaleway.pub"

      - name: terraform init
        working-directory: ${{ env.TF_DIR }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: terraform init -input=false

      - name: terraform apply
        working-directory: ${{ env.TF_DIR }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
          TF_VAR_scw_access_key: ${{ secrets.SCW_ACCESS_KEY }}
          TF_VAR_scw_secret_key: ${{ secrets.SCW_SECRET_KEY }}
          TF_VAR_scw_project_id: ${{ secrets.SCW_PROJECT_ID }}
          TF_VAR_ssh_public_key_path: ${{ runner.temp }}/scaleway.pub
          TF_VAR_kubeconfig_path: ./kubeconfig
          TF_VAR_domain: ${{ vars.TF_DOMAIN }}
          TF_VAR_letsencrypt_email: ${{ vars.TF_LETSENCRYPT_EMAIL }}
        run: terraform apply -input=false -auto-approve
