# ============================================================================
# health-stack — default values
# ----------------------------------------------------------------------------
# Environment files layer on top:
#   -f values-hetzner.yaml   (hcloud-volumes storage, prod HAPI sizing, TLS)
#   -f values-dev.yaml       (kind: NodePort, nip.io host, no TLS, local images)
#
# Everything an environment actually varies lives in `global`, `ingress`, `images`,
# `storage`, and per-service `resources` — that is the entire portability surface.
# Targeting another cloud means one new values file (mostly `storage.className`);
# the templates never branch on the provider.
# ============================================================================

global:
  # Namespace is created by Kustomize/Helm via `--create-namespace` OR by this
  # chart when `namespace.create=true`. Kept as a value so templates can label
  # resources consistently; the release namespace still comes from `helm -n`.
  partOf: freshehr-open-health-stack

# The chart installs into the release namespace (helm -n <ns>). Optionally it can
# also render a Namespace object (useful when Terraform installs it and wants the
# namespace owned by the release). Default false — most flows use `helm -n ... --create-namespace`.
namespace:
  create: false
  name: health-stack

# ── Storage ──────────────────────────────────────────────────────────────────
# Postgres PVCs use this class. "" = cluster default (kind/dev).
#   hetzner: hcloud-volumes  (other clouds: e.g. gp3 on EKS, managed-csi on AKS)
storage:
  className: ""

# ── Ingress ──────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  host: health.local
  # Prefix-strip rewrite handled by ingress-nginx (mirrors docker/nginx/nginx.conf).
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    # openEHR operational templates are large XML (the IPS OPT is ~3 MB) and FHIR
    # bundles can be too. ingress-nginx defaults to a 1 MB body limit, which returns
    # 413 on the OPT upload — and then every composition store fails 422 because the
    # template was never registered. 0 = no limit; set a real ceiling if exposed.
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
  tls:
    enabled: false
    # cert-manager ClusterIssuer name; the chart can also render the ClusterIssuer
    # itself (see clusterIssuer.* below) for a one-shot install.
    clusterIssuer: letsencrypt-prod
    secretName: health-stack-tls

  # ── Edge OAuth2 for HAPI + openFHIR (ingress-nginx auth-url → oauth2-proxy) ─
  # EHRbase validates Bearer tokens natively (SECURITY_AUTHTYPE=OAUTH), but HAPI
  # and openFHIR have NO application-level auth. Unauthenticated, /fhir accepts
  # POST/PUT/DELETE on every resource type — and because the openFHIR interceptor
  # forwards matching writes into EHRbase, an open /fhir is a write path into the
  # CDR that bypasses EHRbase's own token validation. So the edge must enforce it.
  #
  # Enforced by an ingress-nginx auth-url subrequest to the in-cluster
  # oauth2-proxy on /fhir only (mirrors docker/nginx/nginx.conf
  # `auth_request`; /ehrbase and /openfhir validate natively), so it applies
  # ONLY to traffic arriving through the ingress. In-cluster traffic is
  # unaffected — which is what keeps the kubelet probes (pod IP) working
  # without credentials. The HAPI→openFHIR interceptor call authenticates
  # itself (openfhir.oauth2.* in the hapi-config Secret).
  #
  # Default OFF so dev/kind installs stay frictionless; values-hetzner.yaml turns
  # it ON, because that is the environment actually exposed to the internet.
  # Requires oauth2Proxy.enabled + keycloak.enabled (both default true).
  auth:
    enabled: false
    # auth-signin adds a browser redirect into the oauth2-proxy login flow on
    # 401; API callers just get the 401. Harmless either way.
    signin: true

# Optionally render a cert-manager ClusterIssuer (Let's Encrypt HTTP-01 via nginx).
# Requires cert-manager installed in the cluster (Terraform k8s-apps does this).
clusterIssuer:
  create: false
  name: letsencrypt-prod
  email: admin@example.com
  server: https://acme-v02.api.letsencrypt.org/directory
  ingressClass: nginx

# ── Images ───────────────────────────────────────────────────────────────────
# Custom images (built in CI) get pinned per environment; upstream images have
# sensible defaults matching the compose/base topology.
images:
  # HAPI FHIR + the openFHIR interceptor JAR (built from docker/hapi/Dockerfile).
  hapi:
    repository: ghcr.io/freshehrteam/hapi-openfhir
    # Explicit release tag (not `latest`): produced by CI's type=semver on the
    # matching `v0.4.0` git tag. Keep in step with Chart.yaml version and publish
    # the tag before `terraform apply`, else the pod pulls a nonexistent image.
    tag: "0.4.4"
    pullPolicy: IfNotPresent
  # Data-only image: the EPS FHIRConnect mappings + OPT, copied into the openFHIR
  # pod by an initContainer (built from docker/openfhir/bootstrap.Dockerfile).
  # The key keeps its historical `ipsMappings` name so existing overrides survive;
  # the repository it points at is the EPS bundle.
  ipsMappings:
    repository: ghcr.io/freshehrteam/fhirconnect-eps-mappings
    tag: "0.4.4"
    pullPolicy: IfNotPresent
  # hades FHIR terminology server (built from docker/hades/Dockerfile — the
  # upstream JAR version is pinned by that Dockerfile's ARG HADES_VERSION; this
  # tag is the team's release tag, same IMAGE_TAG= rule as the other images).
  hades:
    repository: ghcr.io/freshehrteam/hades
    tag: "0.4.4"
    pullPolicy: IfNotPresent
imagePullSecrets: []

# ── Secrets ──────────────────────────────────────────────────────────────────
# By default the chart does NOT create Secrets (they hold credentials + the
# openFHIR license). It only references them by name — create them out-of-band;
# see charts/health-stack/secrets.example.yaml for a template. For dev convenience
# you can flip `create: true` to render the example values (NEVER do this in prod).
secrets:
  create: false
  # When create=true these placeholder values are rendered. Match secrets.example.yaml.
  values:
    postgres:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      EHRBASE_USER: ehrbase_restricted
      EHRBASE_PASSWORD: ehrbase_restricted
      EHRBASE_USER_ADMIN: ehrbase
      EHRBASE_PASSWORD_ADMIN: ehrbase
    ehrbase:
      # Native OAuth2 resource server against the freshehr Keycloak realm; the
      # issuer URI is injected by the ehrbase template (health-stack.oidcIssuer).
      # The old BASIC mode (SECURITY_AUTHUSER/PASSWORD) is retired.
      SECURITY_AUTHTYPE: OAUTH
      DB_USER: ehrbase_restricted
      DB_PASS: ehrbase_restricted
      DB_USER_ADMIN: ehrbase
      DB_PASS_ADMIN: ehrbase
      SERVER_NODENAME: local.ehrbase.org
    hapi:
      HAPI_DB_USER: hapi
      HAPI_DB_PASS: hapi
    openfhir:
      OPENFHIR_DB_USER: openfhir
      OPENFHIR_DB_PASS: openfhir
    # Keycloak + oauth2-proxy credentials. Placeholders for dev (secrets.create=true)
    # ONLY — Terraform overrides every one of these with generated values on Hetzner.
    # The three client secrets are substituted into the realm import
    # (config/realm-freshehr.json.tpl) AND handed to their consumers, so realm and
    # consumers always agree.
    keycloak:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      API_CLIENT_SECRET: dev-api-client-secret
      HAPI_SVC_SECRET: dev-hapi-svc-secret
      OAUTH2_PROXY_CLIENT_SECRET: dev-oauth2-proxy-secret
      # Must be exactly 16, 24 or 32 bytes (oauth2-proxy cookie encryption).
      OAUTH2_PROXY_COOKIE_SECRET: 0123456789abcdef0123456789abcdef

# The Secret name each workload references. Override only if you pre-create
# Secrets under different names.
secretNames:
  postgres: postgres-secret
  ehrbase: ehrbase-secret
  hapi: hapi-secret
  openfhir: openfhir-secret
  openfhirLicense: openfhir-license
  keycloak: keycloak-secret
  oauth2Proxy: oauth2-proxy-secret

# Shared Postgres image used by the wait-for-postgres initContainers.
initPostgresImage: postgres:16-alpine

# ── HAPI ─────────────────────────────────────────────────────────────────────
hapi:
  enabled: true
  replicas: 1
  image: {}            # falls back to .Values.images.hapi
  # Non-secret env (was the hapi-env ConfigMap). Points at the in-cluster engine.
  env:
    OPENFHIR_BASE_URL: http://openfhir:8080
    HAPI_FHIR_IPS_ENABLED: "true"
  resources: {}
  readiness:
    path: /fhir/metadata
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 30
  liveness:
    path: /fhir/metadata
    initialDelaySeconds: 150
    periodSeconds: 20
  service:
    type: ClusterIP
    port: 8080
    nodePort: null

# ── EHRbase ──────────────────────────────────────────────────────────────────
ehrbase:
  enabled: true
  replicas: 1
  image:
    repository: ehrbase/ehrbase
    # Pinned, not :latest — the MANAGEMENT_* env above is version-coupled (see
    # comment there), and an unpinned tag let the cluster and a local checkout
    # resolve to different EHRbase generations with opposite crash modes.
    tag: 2.36.0
    pullPolicy: IfNotPresent
  env:
    DB_URL: jdbc:postgresql://postgres:5432/ehrbase
    SPRING_PROFILES_ACTIVE: local
    # OAuth mode (SECURITY_AUTHTYPE=OAUTH in the ehrbase Secret). Explicit
    # defaults, stated for greppability: non-admin needs USER, /rest/admin/**
    # needs ADMIN. Roles come from the token's realm_access.roles.
    SECURITY_OAUTH2USERROLE: USER
    SECURITY_OAUTH2ADMINROLE: ADMIN
    # In OAUTH mode /rest/status is no longer public, so the probes move to the
    # Spring management health endpoint — these two make it public.
    # ⚠ VERSION-COUPLED to the pinned image below: EHRbase ≥2.35 sets
    # management.endpoint.health.ACCESS in its bundled config (override the same
    # property), while ≤2.28 sets health.ENABLED — and Spring treats the
    # enabled+access PAIR as mutually exclusive, so using the wrong one for the
    # image generation crashes EHRbase at startup. If you change the image tag,
    # check which property that version's bundled application.yml uses.
    MANAGEMENT_ENDPOINT_HEALTH_ACCESS: READ_ONLY
    MANAGEMENT_ENDPOINTS_WEB_ACCESS: PUBLIC
    # SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUERURI is injected by the
    # template (health-stack.oidcIssuer → https://<ingress.host>/auth/realms/…);
    # set it here only to override that computed value.
  resources: {}
  readiness:
    # Unauthenticated management endpoint (see env above) — /ehrbase/rest/status
    # now requires a Bearer token, which the kubelet cannot supply.
    path: /ehrbase/management/health
    initialDelaySeconds: 40
    periodSeconds: 10
    failureThreshold: 30
  liveness:
    path: /ehrbase/management/health
    initialDelaySeconds: 120
    periodSeconds: 20
  service:
    type: ClusterIP
    port: 8080

# ── openFHIR engine ──────────────────────────────────────────────────────────
openfhir:
  replicas: 1
  # openfhir-enterprise, NOT openfhir: the Postgres repository implementation
  # (openfhir.db.type=postgres) ships only in the enterprise engine. The community
  # openfhir image is Mongo-only and fails with "No qualifying bean of type
  # FhirConnectModelRepository" under a postgres config.
  image:
    repository: openfhir/openfhir-enterprise
    # Pinned — must match the compose default (docker/docker-compose.yml
    # OPENFHIR_IMAGE fallback).
    tag: 3.0.2
    pullPolicy: IfNotPresent
  # EPS mappings initContainer image. Empty = fall back to .Values.images.ipsMappings.
  mappingsImage: {}
  resources: {}
  readiness:
    path: /health
    initialDelaySeconds: 40
    periodSeconds: 10
    failureThreshold: 30
  liveness:
    path: /health
    initialDelaySeconds: 120
    periodSeconds: 20
  service:
    type: ClusterIP
    port: 8080

# ── hades (FHIR terminology server) ──────────────────────────────────────────
# SNOMED CT / LOINC / FHIR-package terminology over $lookup/$expand/
# $validate-code/$subsumes/$translate. No Postgres wiring: terminology lives in
# *.db files on its own PVC, bootstrapped from the public FHIR package registry
# on first boot (see docker/hades/entrypoint.sh). SNOMED/LOINC are optional
# operator imports — runbook in charts/health-stack/README.md.
hades:
  enabled: true
  # Must stay 1: the data PVC is ReadWriteOnce and the Deployment uses
  # strategy Recreate so the old pod releases it before the new one mounts.
  replicas: 1
  image: {}            # falls back to .Values.images.hades
  env:
    # -Xmx1g fits the FHIR-packages-only bootstrap; values-hetzner raises it
    # for SNOMED-loaded sizing.
    JAVA_OPTS: "-Xmx1g"
  # PVC size for /data. Raise BEFORE importing SNOMED (snomed.db Intl ≈ 3–4 GiB).
  storage: 5Gi
  resources: {}
  # First boot downloads + indexes FHIR packages before the port opens; the
  # startupProbe budgets 10s × this threshold (default 60 → 10 min) so
  # readiness/liveness can stay tight once serving.
  startupFailureThreshold: 60
  readiness:
    path: /fhir/metadata
    periodSeconds: 10
    failureThreshold: 3
  liveness:
    path: /fhir/metadata
    periodSeconds: 20
  service:
    type: ClusterIP
    port: 8080

# ── Keycloak (OIDC identity provider) ────────────────────────────────────────
# Runs in production mode (`start --import-realm`) behind the TLS-terminating
# ingress: KC_HTTP_ENABLED=true + KC_PROXY_HEADERS=xforwarded. The canonical
# issuer is the PUBLIC URL https://<ingress.host>/auth/realms/<realm>
# (KC_HOSTNAME) — in-cluster validators fetch discovery through the LB (hairpin;
# needs the domain to resolve), while the HAPI interceptor fetches tokens from
# the in-cluster Service (Keycloak answers under any Host header but always
# stamps the canonical `iss`). Realm imported from a chart-rendered Secret
# (config/realm-freshehr.json.tpl, client secrets substituted from
# secrets.values.keycloak).
#
# ⚠ The admin console is publicly reachable at /auth/admin (generated 32-char
# password from Terraform). To harden, deny that path at the ingress and
# port-forward instead.
keycloak:
  enabled: true
  replicas: 1
  image:
    repository: quay.io/keycloak/keycloak
    tag: 26.8.0
    pullPolicy: IfNotPresent
  realm: freshehr
  resources: {}
  # Probes hit the management port (9000) natively via httpGet — no shell tricks
  # needed in k8s (unlike the compose healthcheck's bash-/dev/tcp workaround).
  readiness:
    path: /auth/health/ready
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 30
  liveness:
    path: /auth/health/live
    initialDelaySeconds: 120
    periodSeconds: 20
  service:
    type: ClusterIP
    port: 8080
    managementPort: 9000

# ── oauth2-proxy (edge Bearer-token validator for ingress auth-url) ──────────
# auth_request-only deployment (static upstream): ingress-nginx sends auth-url
# subrequests here for /fhir; oauth2-proxy validates the Bearer JWT
# (signature, issuer, aud=oauth2-proxy) and answers 202/401. /ehrbase and
# /openfhir need no subrequest — both validate natively.
oauth2Proxy:
  enabled: true
  replicas: 1
  image:
    repository: quay.io/oauth2-proxy/oauth2-proxy
    tag: v7.15.5
    pullPolicy: IfNotPresent
  resources: {}
  service:
    type: ClusterIP
    port: 4180

# ── Postgres backends ────────────────────────────────────────────────────────
# ONE Postgres shared by EHRbase, HAPI, openFHIR and Keycloak (a database each). Must stay on
# the ehrbase vendor image — EHRbase needs the extensions/roles it pre-provisions;
# the other two just need an empty database. Non-production choice; see README.
postgres:
  image:
    repository: ehrbase/ehrbase-v2-postgres
    tag: "16.2"
    pullPolicy: IfNotPresent
  storage: 5Gi
  resources: {}

# Common pod scheduling knobs applied to every workload (override per-service
# via that service's own block if needed later).
nodeSelector: {}
tolerations: []
affinity: {}
