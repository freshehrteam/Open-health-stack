{{/*
The six credential Secrets every workload's envFrom references by name
(.Values.secretNames.*) — postgres, ehrbase, hapi, openfhir, keycloak,
oauth2-proxy. Shape and keys mirror secrets.example.yaml exactly.

Only rendered when secrets.create=true (Terraform on Hetzner/Scaleway, or
values-dev.yaml for kind/minikube). When false, these Secrets must be applied
out-of-band from secrets.example.yaml before install — see that file's header
and NOTES.txt.
*/}}
{{- if .Values.secrets.create }}
{{- $v := .Values.secrets.values -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretNames.postgres }}
  labels:
    {{- include "health-stack.componentLabels" (dict "ctx" . "name" "postgres") | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ required "secrets.values.postgres.POSTGRES_USER is required" $v.postgres.POSTGRES_USER | quote }}
  POSTGRES_PASSWORD: {{ required "secrets.values.postgres.POSTGRES_PASSWORD is required" $v.postgres.POSTGRES_PASSWORD | quote }}
  EHRBASE_USER: {{ required "secrets.values.postgres.EHRBASE_USER is required" $v.postgres.EHRBASE_USER | quote }}
  EHRBASE_PASSWORD: {{ required "secrets.values.postgres.EHRBASE_PASSWORD is required" $v.postgres.EHRBASE_PASSWORD | quote }}
  EHRBASE_USER_ADMIN: {{ required "secrets.values.postgres.EHRBASE_USER_ADMIN is required" $v.postgres.EHRBASE_USER_ADMIN | quote }}
  EHRBASE_PASSWORD_ADMIN: {{ required "secrets.values.postgres.EHRBASE_PASSWORD_ADMIN is required" $v.postgres.EHRBASE_PASSWORD_ADMIN | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretNames.ehrbase }}
  labels:
    {{- include "health-stack.componentLabels" (dict "ctx" . "name" "ehrbase") | nindent 4 }}
type: Opaque
stringData:
  SECURITY_AUTHTYPE: {{ required "secrets.values.ehrbase.SECURITY_AUTHTYPE is required" $v.ehrbase.SECURITY_AUTHTYPE | quote }}
  DB_USER: {{ required "secrets.values.ehrbase.DB_USER is required" $v.ehrbase.DB_USER | quote }}
  DB_PASS: {{ required "secrets.values.ehrbase.DB_PASS is required" $v.ehrbase.DB_PASS | quote }}
  DB_USER_ADMIN: {{ required "secrets.values.ehrbase.DB_USER_ADMIN is required" $v.ehrbase.DB_USER_ADMIN | quote }}
  DB_PASS_ADMIN: {{ required "secrets.values.ehrbase.DB_PASS_ADMIN is required" $v.ehrbase.DB_PASS_ADMIN | quote }}
  SERVER_NODENAME: {{ required "secrets.values.ehrbase.SERVER_NODENAME is required" $v.ehrbase.SERVER_NODENAME | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretNames.hapi }}
  labels:
    {{- include "health-stack.componentLabels" (dict "ctx" . "name" "hapi") | nindent 4 }}
type: Opaque
stringData:
  HAPI_DB_USER: {{ required "secrets.values.hapi.HAPI_DB_USER is required" $v.hapi.HAPI_DB_USER | quote }}
  HAPI_DB_PASS: {{ required "secrets.values.hapi.HAPI_DB_PASS is required" $v.hapi.HAPI_DB_PASS | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretNames.openfhir }}
  labels:
    {{- include "health-stack.componentLabels" (dict "ctx" . "name" "openfhir") | nindent 4 }}
type: Opaque
stringData:
  OPENFHIR_DB_USER: {{ required "secrets.values.openfhir.OPENFHIR_DB_USER is required" $v.openfhir.OPENFHIR_DB_USER | quote }}
  OPENFHIR_DB_PASS: {{ required "secrets.values.openfhir.OPENFHIR_DB_PASS is required" $v.openfhir.OPENFHIR_DB_PASS | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretNames.keycloak }}
  labels:
    {{- include "health-stack.componentLabels" (dict "ctx" . "name" "keycloak") | nindent 4 }}
type: Opaque
stringData:
  KC_BOOTSTRAP_ADMIN_USERNAME: {{ required "secrets.values.keycloak.KC_BOOTSTRAP_ADMIN_USERNAME is required" $v.keycloak.KC_BOOTSTRAP_ADMIN_USERNAME | quote }}
  KC_BOOTSTRAP_ADMIN_PASSWORD: {{ required "secrets.values.keycloak.KC_BOOTSTRAP_ADMIN_PASSWORD is required" $v.keycloak.KC_BOOTSTRAP_ADMIN_PASSWORD | quote }}
  KC_DB_USERNAME: {{ required "secrets.values.keycloak.KC_DB_USERNAME is required" $v.keycloak.KC_DB_USERNAME | quote }}
  KC_DB_PASSWORD: {{ required "secrets.values.keycloak.KC_DB_PASSWORD is required" $v.keycloak.KC_DB_PASSWORD | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretNames.oauth2Proxy }}
  labels:
    {{- include "health-stack.componentLabels" (dict "ctx" . "name" "oauth2-proxy") | nindent 4 }}
type: Opaque
stringData:
  OAUTH2_PROXY_CLIENT_SECRET: {{ required "secrets.values.keycloak.OAUTH2_PROXY_CLIENT_SECRET is required" $v.keycloak.OAUTH2_PROXY_CLIENT_SECRET | quote }}
  OAUTH2_PROXY_COOKIE_SECRET: {{ required "secrets.values.keycloak.OAUTH2_PROXY_COOKIE_SECRET is required" $v.keycloak.OAUTH2_PROXY_COOKIE_SECRET | quote }}
{{- end }}
