apiVersion: v2
name: health-stack
description: >-
  freshehr-open-health-stack — a dockerized openEHR → FHIR health-data stack
  (HAPI FHIR with the openFHIR interceptor, EHRbase, the openFHIR engine, the
  hades terminology server, and their Postgres backends). Runs on any
  Kubernetes cluster; ships values files for Hetzner k3s (prod) and
  kind/minikube (dev).
type: application

# Chart version — bump on EVERY chart change (SemVer).
# ⚠ The bump is not cosmetic: Terraform's helm provider only re-renders the
# release when an input changes, and for a local chart path that input is THIS
# version — template/config edits without a bump make `terraform apply` report
# "No changes" and the cluster silently keeps the old manifests.
version: 0.4.4

# The version of the app stack this chart deploys. Informational; the actual
# image tags are set per-workload under `images.*` / `.image.tag` in values.yaml.
appVersion: "0.1.0"

keywords:
  - openehr
  - fhir
  - hapi
  - ehrbase
  - openfhir
  - health
home: https://github.com/freshehrteam/Open-health-stack
sources:
  - https://github.com/freshehrteam/Open-health-stack
maintainers:
  - name: freshEHR
